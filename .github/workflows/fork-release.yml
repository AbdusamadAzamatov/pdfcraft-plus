# PdfCraft Plus release for macOS: builds the universal (Apple silicon + Intel) DMG and CLI zip with
# packaging/macos/package.sh on a free GitHub-hosted runner, writes SHA256SUMS.txt and, for a
# pushed tag vX.Y.Z, attaches all three to a draft GitHub Release for the owner to review and
# publish. A manual run builds and uploads the files as a workflow artefact only.
#
# Builds are ad-hoc signed and not notarised (no Apple Developer account yet), so macOS asks users
# to allow the app once (docs/install-macos.md). When the account exists, add the APPLE_* secrets
# and an import-cert.sh step: package.sh then signs with Developer ID and notarises.
name: Fork release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Each job asks for what it needs; nothing by default.
permissions: {}

concurrency:
  group: fork-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build macOS universal
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Cargo.toml sets rust-version = "1.95" and the repository has no rust-toolchain file, so
      # current stable, with both macOS targets for the universal binary.
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: fork-release-macos-universal

      - name: Read the version
        id: version
        run: |
          set -euo pipefail
          . packaging/env.sh
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          if [[ "$GITHUB_REF_TYPE" = "tag" ]] && [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION (expected v$VERSION)"
            exit 1
          fi

      - name: Build, sign (ad-hoc) and package
        env:
          DIST: ${{ github.workspace }}/dist/release
        run: packaging/macos/package.sh --arch universal

      - name: Checksums
        working-directory: dist/release
        run: |
          set -euo pipefail
          shasum -a 256 pdfcraft-plus-*-macos-universal.dmg pdfcraft-plus-cli-*-macos-universal.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          shasum -a 256 -c SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfcraft-plus-macos-universal
          path: |
            dist/release/pdfcraft-plus-*-macos-universal.dmg
            dist/release/pdfcraft-plus-cli-*-macos-universal.zip
            dist/release/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that can write: it never runs the build or anything from the repository.
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the build
        run: gh run download "$GITHUB_RUN_ID" --name pdfcraft-plus-macos-universal --dir release

      - name: Create or update the draft release
        working-directory: release
        run: |
          set -euo pipefail
          shasum -a 256 -c SHA256SUMS.txt
          files=(pdfcraft-plus-*-macos-universal.dmg pdfcraft-plus-cli-*-macos-universal.zip SHA256SUMS.txt)
          cat > notes.md <<EOF
          PdfCraft Plus $VERSION for macOS 11 or later (Apple silicon and Intel).

          - **App:** \`pdfcraft-plus-$VERSION-macos-universal.dmg\`: open it and drag PdfCraft Plus to Applications.
          - **CLI:** \`pdfcraft-plus-cli-$VERSION-macos-universal.zip\`
          - **Checksums:** \`SHA256SUMS.txt\` (\`shasum -a 256 -c --ignore-missing SHA256SUMS.txt\`)

          This build is not notarised by Apple, so macOS asks you to allow it the first time: open
          System Settings › Privacy & Security and click Open Anyway. Step-by-step instructions:
          https://github.com/$GH_REPO/blob/$TAG/docs/install-macos.md
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A rerun replaces the files on the existing release (draft or not) and leaves its text.
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --draft --verify-tag \
              --title "PdfCraft Plus $VERSION" --notes-file notes.md
          fi
